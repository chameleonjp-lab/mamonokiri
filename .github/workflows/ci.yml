name: Pull Request Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Check types
        run: pnpm check

      - name: Build for repository path
        run: pnpm exec vite build --base=/mamonokiri/

      - name: Reject editor runtime in production artifact
        run: |
          if rg -n -i "manus-runtime|__manus__|manus-storage|data-loc" dist/public; then
            echo "Unexpected editor runtime found in the production artifact."
            exit 1
          fi
